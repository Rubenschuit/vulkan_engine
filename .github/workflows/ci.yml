name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  VULKAN_SDK_VERSION: "1.4.328.1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux GCC"
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
            generator: Ninja
            build_type: Release

          - name: "Linux Clang"
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
            generator: Ninja
            build_type: Release

          - name: "Windows MSVC"
            os: windows-latest
            generator: "Visual Studio 17 2022"
            cmake_args: "-A x64"
            build_type: Release

          - name: "Windows MinGW"
            os: windows-latest
            generator: "MinGW Makefiles"
            build_type: Release
            mingw: true

          - name: "macOS Clang"
            os: macos-15
            cc: clang
            cxx: clang++
            generator: Ninja
            build_type: Release

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ── System dependencies ────────────────────────────────────────

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xorg-dev \
            libxcb-xinerama0-dev libxcb-xinput-dev libxcb-cursor-dev \
            libwayland-dev libxkbcommon-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Setup MSYS2 (MinGW)
        if: matrix.mingw
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make

      # ── Vulkan SDK ─────────────────────────────────────────────────

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.4.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true
          stripdown: true

      - name: Add Vulkan SDK to PATH (Unix)
        if: runner.os != 'Windows'
        run: echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

      - name: Add Vulkan SDK to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH

      - name: Add Vulkan SDK to MSYS2 PATH
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          VKSDK="${VULKAN_SDK:-C:/VulkanSDK/${VULKAN_SDK_VERSION}}"
          SDK_PATH=$(cygpath -u "$VKSDK")
          echo "export VULKAN_SDK=\"$VKSDK\"" >> ~/.bash_profile
          echo "export PATH=\"${SDK_PATH}/Bin:\$PATH\"" >> ~/.bash_profile
          cat ~/.bash_profile

      - name: Verify Vulkan SDK and slangc
        if: "!matrix.mingw"
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          ls "$VULKAN_SDK/bin/" 2>/dev/null || ls "$VULKAN_SDK/Bin/" 2>/dev/null || echo "Could not list SDK bin directory"
          slangc -v
        shell: bash

      - name: Verify Vulkan SDK and slangc (MinGW)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          source ~/.bash_profile
          echo "VULKAN_SDK=$VULKAN_SDK"
          ls "$SDK_PATH/Bin/" 2>/dev/null || ls "$(cygpath -u "$VULKAN_SDK")/Bin/" 2>/dev/null || echo "Could not list SDK bin directory"
          slangc -v

      # ── FetchContent cache ─────────────────────────────────────────

      - name: Cache FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.name }}-${{ hashFiles('CMakeLists.txt', 'cmake/Dependencies.cmake', 'cmake/Tests.cmake') }}
          restore-keys: deps-${{ matrix.name }}-

      # ── Configure ──────────────────────────────────────────────────

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVE_BUILD_TESTS=ON
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}

      - name: Configure (MSVC)
        if: runner.os == 'Windows' && !matrix.mingw
        run: >
          cmake -S . -B build
          -G "${{ matrix.generator }}"
          ${{ matrix.cmake_args }}
          -DVE_BUILD_TESTS=ON

      - name: Configure (MinGW)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          source ~/.bash_profile
          cmake -S . -B build \
            -G "MinGW Makefiles" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DVE_BUILD_TESTS=ON

      # ── Build ──────────────────────────────────────────────────────

      - name: Build (Unix / MSVC)
        if: "!matrix.mingw"
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Build (MinGW)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          source ~/.bash_profile
          cmake --build build --config ${{ matrix.build_type }} --parallel

      # ── Test ───────────────────────────────────────────────────────

      - name: Test (Unix / MSVC)
        if: "!matrix.mingw"
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --exclude-regex "pipeline_config"

      - name: Test (MinGW)
        if: matrix.mingw
        shell: msys2 {0}
        run: |
          source ~/.bash_profile
          ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure --exclude-regex "pipeline_config"
